name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'   # 18:00 UTC = 02:00 Singapore
  workflow_dispatch:
    inputs:
      marker:
        description: 'Only run tests with this marker, e.g. smoke (empty = all)'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPRINT: sprint5            # which Toolshop version to start
      DISABLE_LOGGING: "true"
    steps:
      - uses: actions/checkout@v6

      # ---- Start our own copy of Toolshop (no Cloudflare, fresh data every run) ----
      - name: Check out Toolshop
        uses: actions/checkout@v6
        with:
          repository: testsmith-io/practice-software-testing
          path: toolshop

      - name: Start Toolshop containers
        working-directory: toolshop
        run: docker compose -f docker-compose.yml up -d --build

      - name: Install API dependencies
        working-directory: toolshop
        run: |
          docker compose wait composer || true   # let the one-off install container finish
          docker compose exec -T -u root laravel-api composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-ffi

      - name: Wait for the database
        working-directory: toolshop
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent && exit 0
            echo "database not ready ($i/30)"; sleep 2
          done
          exit 1

      - name: Create and seed the database
        working-directory: toolshop
        run: docker compose exec -T laravel-api php artisan migrate:refresh --seed

      - name: Wait for the web UI
        working-directory: toolshop
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4200 && exit 0
            echo "UI not ready ($i/60)"; sleep 5
          done
          docker compose logs angular-ui
          exit 1

      # ---- Our tests, pointed at the local copy ----
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run tests
        env:
          MARKER: ${{ inputs.marker }}
          API_URL: http://localhost:8091
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          args=(--base-url http://localhost:4200)
          if [ -n "$MARKER" ]; then args+=(-m "$MARKER"); fi
          uv run pytest "${args[@]}"

      - name: Show Toolshop logs on failure
        if: failure()
        working-directory: toolshop
        run: docker compose logs --tail=100
