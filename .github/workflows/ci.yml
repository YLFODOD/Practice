name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      marker:
        description: 'Run tests with a specific marker'
        required: false
        default: ''
  

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      
      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run tests
        env:
          MARKER: ${{ inputs.marker }}
        run: |
          if [ -n "${MARKER}" ]; then
             uv run pytest -m "$MARKER"
          else
              uv run pytest
          fi
       